[package]
name = "speech-clip-oss"
version = "0.1.0"
description = "Open-source local voice dictation for macOS (Parakeet v3 / transcribe-rs ONNX)"
authors = ["Speech Clip Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "speech_clip_oss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
mouse_position = "0.1"
arboard = "3.4"
dirs = "6.0.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
once_cell = "1.19"
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
hound = "3.5"
rubato = "0.16"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.26"
core-foundation = "0.9"
core-graphics = "0.23"
